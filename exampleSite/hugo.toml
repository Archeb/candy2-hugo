baseURL = 'https://example.com/'
languageCode = 'zh-CN'
title = 'Candy2'
theme = 'candy2'

# Note: When using this exampleSite, the theme is located at ../../
# Hugo will automatically find it when you run from exampleSite directory
[build]
  cleanDestinationDir = true

[pagination]
  pagerSize = 10

[params]
  author = "mozzie"
  description = "A beautiful Hugo blog theme"
  avatar = "/img/icon-circle.png"
  defaultImage = "/img/cover1.jpg"
  copyright = "© 2024"
  authorImage = "/img/icon-circle.png"

[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "技术"
  url = "/categories/%E6%8A%80%E6%9C%AF/"
  weight = 2
  pre = ""

[[menu.main]]
  name = "日常"
  url = "/categories/日常/"
  weight = 3
  pre = ""

[[menu.main]]
  name = "链接"
  url = "/links/"
  weight = 4
  pre = "&#xe614;"

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 5
  pre = ""

