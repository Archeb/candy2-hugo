# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Candy2"
license = "GPL-3.0"
licenselink = "https://github.com/Archeb/candy2-hugo/blob/main/LICENSE"
description = "A beautiful Hugo theme with glass-ish effects and horizontal scrolling design."
homepage = "https://github.com/Archeb/candy2-hugo"
tags = ["blog", "responsive", "modern","glass-ish", "animation"]
features = ["responsive", "blog", "horizontal-scrolling", "glass-ish", "view-transitions", "modal-posts"]
min_version = "0.152.2"

[author]
  name = "Archeb (original & Hugo port), Someone (Hugo port)"
  homepage = "https://github.com/Archeb/candy2-hugo"

[original]
  name = "Candy2"
  homepage = "https://github.com/Archeb/Candy2"
  repo = "https://github.com/Archeb/Candy2"
