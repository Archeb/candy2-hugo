# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Candy2"
license = "GPL-3.0"
licenselink = "https://github.com/Archeb/candy2-hugo/blob/main/LICENSE"
description = "A beautiful Hugo theme with glassmorphism effects and horizontal scrolling design, converted from the original Candy2 Vue.js theme"
homepage = "https://github.com/Archeb/candy2-hugo"
tags = ["blog", "responsive", "modern", "minimalist", "glassmorphism", "animation"]
features = ["responsive", "blog", "horizontal-scrolling", "glassmorphism", "view-transitions", "modal-posts"]
min_version = "0.152.2"

[author]
  name = "Archeb (original), Archeb (Hugo conversion)"
  homepage = "https://github.com/Archeb/candy2-hugo"

[original]
  name = "Candy2"
  homepage = "https://github.com/Archeb/Candy2"
  repo = "https://github.com/Archeb/Candy2"
