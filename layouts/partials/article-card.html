{{- $featuredImage := .Params.featuredImage | default (.Site.Params.defaultImage | default "/img/cover1.jpg") -}}
<a href="{{ .Permalink }}" class="bean bean-article" style="background-image: url('{{ $featuredImage }}');">
    <div class="article-category">
        <div class="category-item">
            <div class="item-text">{{ .Date.Format "2006年1月2日" }}</div>
        </div>
        {{- range .Params.categories }}
        <div class="category-item">
            <div class="item-text">{{ . }}</div>
        </div>
        {{- end }}
        {{- range .Params.tags }}
        <div class="category-item">
            <div class="item-text">{{ . }}</div>
        </div>
        {{- end }}
    </div>
    <div class="article-title">
        <span>{{ .Title }}</span>
        <div class="article-summary">
            {{ .Description | safeHTML }}
        </div>
    </div>
</a>
