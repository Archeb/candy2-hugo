<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "zh-CN" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{ if .Site.Params.author }}<meta name="author" content="{{ .Site.Params.author }}">{{ end }}
    {{ $style := resources.Get "scss/style.scss" }}
    {{ $style = $style | css.Sass | resources.Minify }}
    {{ if hugo.IsProduction }}
    {{ $style = $style | resources.Fingerprint }}
    {{ end }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
    <meta name="view-transition" content="same-origin">
    {{ block "head" . }}{{ end }}
</head>
<body>
    {{ block "main" . }}{{ end }}
    <script src="{{ "js/candy2.js" | relURL }}"></script>
</body>
</html>
